# Modelo de configuração. Não está ativo neste repositório.
# Mesclar com a configuração existente somente na etapa de instalação aprovada.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
